<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabuk Marble Pro System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f5;padding:10px}

.container{background:#fff;padding:15px;border-radius:10px}

input,select{
width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:5px
}

button{
width:100%;padding:10px;margin-top:5px;border:none;border-radius:5px;color:#fff;font-weight:bold
}

.green{background:green}
.blue{background:#007bff}
.red{background:red}
.orange{background:orange}
.gray{background:#444}

table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#222;color:#fff}

.card{background:#f9f9f9;padding:10px;margin-top:10px;border-radius:8px}
</style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginBox" class="container">
<h2>🔐 ADMIN LOGIN</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button class="green" onclick="login()">Login</button>
</div>

<!-- ================= SYSTEM ================= -->
<div id="app" style="display:none">

<div class="container">

<h2>TABUK MARBLE SYSTEM</h2>

<input id="name" placeholder="Item Name">
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<input id="pieces" type="number" placeholder="Pieces">

<input id="cost" type="number" placeholder="Cost Price">
<input id="sell" type="number" placeholder="Selling Price">

<input id="customer" placeholder="Customer Name">
<input id="discount" type="number" placeholder="Discount %">

<select id="currency">
<option value="SAR">SAR</option>
<option value="PKR">PKR</option>
<option value="USD">USD</option>
</select>

<button class="green" onclick="addItem()">➕ Add Item</button>
<button class="blue" onclick="downloadPDF()">📄 PDF Invoice</button>
<button class="orange" onclick="confirmOrder()">✅ Confirm Order</button>
<button class="red" onclick="clearAll()">🗑 Clear</button>

<table>
<tr>
<th>Name</th>
<th>L</th>
<th>W</th>
<th>Pcs</th>
<th>Total</th>
<th>Action</th>
</tr>
<tbody id="list"></tbody>
</table>

<h3 id="grandTotal">Total: 0</h3>

<div class="card">
<h3>📊 ADMIN DASHBOARD</h3>
<p id="dash"></p>
</div>

</div>

</div>

<script>

let items=[];
let sales=JSON.parse(localStorage.getItem("sales"))||[];

/* ================= LOGIN ================= */
function login(){
let p=document.getElementById("pass").value;

// SIMPLE PASSWORD (change if needed)
if(p==="1234"){
loginBox.style.display="none";
app.style.display="block";
}else{
alert("Wrong Password");
}
}

/* ================= ADD ITEM ================= */
function addItem(){

let n=name.value;
let l=+length.value;
let w=+width.value;
let p=+pieces.value;
let cp=+cost.value;
let sp=+sell.value;

if(!n||!l||!w||!p||!cp||!sp)return alert("Fill all");

let profit=(sp-cp)*p;

items.push({n,l,w,p,cp,sp,profit});
render();
}

/* ================= RENDER ================= */
function render(){

let html="";
let total=0;
let profit=0;

items.forEach((i,index)=>{
total+=i.sp*i.p;
profit+=i.profit;

html+=`
<tr>
<td>${i.n}</td>
<td>${i.l}</td>
<td>${i.w}</td>
<td>${i.p}</td>
<td>${(i.sp*i.p).toFixed(2)}</td>
<td><button onclick="del(${index})" style="background:red">❌</button></td>
</tr>`;
});

list.innerHTML=html;
grandTotal.innerText="Sales: "+total.toFixed(2)+" | Profit: "+profit.toFixed(2);

dash.innerText="TOTAL PROFIT: "+profit.toFixed(2);
}

/* ================= DELETE ================= */
function del(i){
items.splice(i,1);
render();
}

/* ================= CLEAR ================= */
function clearAll(){
items=[];
render();
}

/* ================= CONFIRM ORDER ================= */
function confirmOrder(){

let total=0;
let profit=0;

items.forEach(i=>{
total+=i.sp*i.p;
profit+=i.profit;
});

sales.push({
total,
profit,
date:new Date().toLocaleString()
});

localStorage.setItem("sales",JSON.stringify(sales));

items=[];
render();

alert("Order Confirmed");
}

/* ================= PDF (NO PROFIT FOR CUSTOMER) ================= */
function downloadPDF(){

const {jsPDF}=window.jspdf;
let doc=new jsPDF();

let y=20;
let total=0;

doc.setFontSize(18);
doc.text("TABUK MARBLE INVOICE",105,10,{align:"center"});

items.forEach(i=>{
total+=i.sp*i.p;

// ONLY CUSTOMER DATA (NO PROFIT)
doc.text(`${i.n} | ${i.p} pcs | ${i.sp*i.p}`,10,y);
y+=8;
});

doc.text("TOTAL: "+total.toFixed(2),10,y+10);

doc.save("invoice.pdf");
}

</script>

</body>
</html>
