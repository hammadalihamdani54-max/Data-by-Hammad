<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shop System Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f5;padding:10px}

.container{background:#fff;padding:15px;border-radius:10px}

input,select{
width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:5px
}

button{
width:100%;padding:10px;margin-top:5px;border:none;border-radius:5px;color:#fff;font-weight:bold
}

.green{background:green}
.blue{background:#007bff}
.red{background:red}
.orange{background:orange}
.gray{background:#444}

table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#222;color:#fff}

.card{background:#f8f8f8;padding:10px;margin-top:10px;border-radius:8px}
</style>
</head>

<body>

<div class="container">

<h2 style="text-align:center">🛒 FULL SHOP SYSTEM</h2>

<!-- INPUTS -->
<input id="name" placeholder="Item Name">
<input id="cost" type="number" placeholder="Cost Price">
<input id="sell" type="number" placeholder="Selling Price">
<input id="qty" type="number" placeholder="Quantity">

<input id="customer" placeholder="Customer Name">
<input id="discount" type="number" placeholder="Discount %">

<select id="status">
<option value="PAID">PAID</option>
<option value="NOT PAID">NOT PAID</option>
</select>

<!-- BUTTONS -->
<button class="green" onclick="addItem()">➕ Add Item</button>
<button class="blue" onclick="downloadPDF()">📄 Invoice PDF</button>
<button class="orange" onclick="confirmOrder()">✅ Confirm Order</button>
<button class="red" onclick="clearCart()">🗑 Clear</button>

<!-- TABLE -->
<table>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Sell</th>
<th>Total</th>
<th>Action</th>
</tr>
<tbody id="list"></tbody>
</table>

<h3 id="totalBox">Total: 0 | Profit: 0</h3>

<div class="card">
<h3>📊 Monthly Dashboard</h3>
<p id="dash">No Data</p>
</div>

</div>

<script>

let cart=[];
let sales=JSON.parse(localStorage.getItem("sales"))||[];

/* ================= ADD ITEM ================= */
function addItem(){

let n=name.value;
let c=+cost.value;
let s=+sell.value;
let q=+qty.value;

if(!n||!c||!s||!q){
alert("Fill all fields");
return;
}

cart.push({
n,c,s,q,
profit:(s-c)*q
});

render();
}

/* ================= RENDER ================= */
function render(){

let html="";
let total=0;
let profit=0;

cart.forEach((i,index)=>{
total+=i.s*i.q;
profit+=i.profit;

html+=`
<tr>
<td>${i.n}</td>
<td>${i.q}</td>
<td>${i.s}</td>
<td>${(i.s*i.q).toFixed(2)}</td>
<td><button onclick="del(${index})" style="background:red">❌</button></td>
</tr>`;
});

list.innerHTML=html;
totalBox.innerText="Total: "+total.toFixed(2)+" | Profit: "+profit.toFixed(2);

dash.innerText="Profit: "+profit.toFixed(2);
}

/* ================= DELETE ================= */
function del(i){
cart.splice(i,1);
render();
}

/* ================= CLEAR ================= */
function clearCart(){
cart=[];
render();
}

/* ================= CONFIRM ORDER ================= */
function confirmOrder(){

let total=0;
let profit=0;

cart.forEach(i=>{
total+=i.s*i.q;
profit+=i.profit;
});

sales.push({
total,
profit,
date:new Date().toLocaleString()
});

localStorage.setItem("sales",JSON.stringify(sales));

cart=[];
render();

alert("Order Saved");
}

/* ================= PDF ================= */
function downloadPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let y = 20;
let total = 0;

let customer = document.getElementById("customer").value || "Walk-in Customer";
let status = document.getElementById("status").value || "NOT PAID";

/* ===== HEADER ===== */
doc.setFontSize(18);
doc.setFont(undefined, "bold");
doc.text("🛒 SHOP INVOICE", 105, 10, { align: "center" });

doc.setFontSize(11);
doc.setFont(undefined, "normal");
doc.text("Customer: " + customer, 14, 25);
doc.text("Status: " + status, 150, 25);

doc.line(14, 30, 195, 30);

/* ===== TABLE HEAD ===== */
y = 40;

doc.setFont(undefined, "bold");
doc.text("Item", 14, y);
doc.text("Qty", 70, y);
doc.text("Price", 110, y);
doc.text("Total", 150, y);

doc.line(14, y+2, 195, y+2);

y += 10;

/* ===== ITEMS ===== */
doc.setFont(undefined, "normal");

cart.forEach(i=>{
let rowTotal = i.s * i.q;
total += rowTotal;

doc.text(i.n, 14, y);
doc.text(String(i.q), 70, y);
doc.text(String(i.s), 110, y);
doc.text(rowTotal.toFixed(2), 150, y);

y += 8;

if(y > 270){
doc.addPage();
y = 20;
}
});

/* ===== TOTAL BOX ===== */
doc.line(120, y, 195, y);
y += 10;

doc.setFont(undefined, "bold");
doc.text("TOTAL: " + total.toFixed(2), 150, y);

/* ===== STAMP ===== */
doc.setTextColor(status === "PAID" ? 0 : 200, 0, 0);
doc.setFontSize(16);
doc.text(status, 160, y + 15);

doc.save("invoice.pdf");
}

</script>

</body>
</html>
