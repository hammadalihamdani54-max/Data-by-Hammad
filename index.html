<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabuk Marble ERP</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f5;margin:0}

.topbar{display:flex;gap:5px;padding:10px;background:#222}
.topbar button{flex:1;padding:10px;border:none;color:#fff;font-weight:bold;border-radius:5px}

.box{display:none;padding:15px}
.active{display:block}

.card{background:#fff;padding:15px;border-radius:10px;margin:10px}

input,select{
width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:5px
}

button{
width:100%;padding:10px;margin-top:5px;border:none;border-radius:5px;color:#fff;font-weight:bold
}

.green{background:green}
.blue{background:#007bff}
.red{background:red}

table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#111;color:#fff}
</style>
</head>

<body>

<div class="topbar">
<button onclick="openTab('pos')" style="background:green">POS</button>
<button onclick="openTab('invoice')" style="background:#007bff">INVOICE</button>
<button onclick="openTab('monthly')" style="background:orange">MONTHLY</button>
</div>

<!-- POS -->
<div id="pos" class="box active">
<div class="card">

<h2>ADD ITEMS</h2>

<input id="name" placeholder="Item Name">
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<input id="pieces" type="number" placeholder="Pieces">
<input id="price" type="number" placeholder="Price">

<button class="green" onclick="addItem()">Add Item</button>
<button class="red" onclick="clearCart()">Clear</button>

<table>
<tr><th>Item</th><th>Qty</th><th>Total</th><th>Action</th></tr>
<tbody id="list"></tbody>
</table>

<h3 id="totalBox">Total: 0</h3>

<button class="blue" onclick="confirmOrder()">Confirm Order</button>

</div>
</div>

<!-- INVOICE -->
<div id="invoice" class="box">
<div class="card">

<h2 style="text-align:center">TABUK MARBLE</h2>

<input id="customer" placeholder="Customer Name">
<input id="discount" type="number" placeholder="Discount %">

<button class="blue" onclick="downloadPDF()">Download PDF</button>

</div>
</div>

<!-- MONTHLY -->
<div id="monthly" class="box">
<div class="card">
<h2>Monthly Records</h2>
<div id="records"></div>
</div>
</div>

<script>

let cart = [];
let monthly = JSON.parse(localStorage.getItem("monthly")) || [];

/* TAB */
function openTab(tab){
document.querySelectorAll(".box").forEach(b=>b.classList.remove("active"));
document.getElementById(tab).classList.add("active");
if(tab==="monthly") loadMonthly();
}

/* ADD ITEM */
function addItem(){

let name = document.getElementById("name").value.trim();
let l = +document.getElementById("length").value;
let w = +document.getElementById("width").value;
let p = +document.getElementById("pieces").value;
let price = +document.getElementById("price").value;

if(!name || !l || !w || !p || !price){
alert("Fill all fields");
return;
}

let total = l*w*p*price;

cart.push({name,p,total});

render();

/* clear */
["name","length","width","pieces","price"].forEach(id=>{
document.getElementById(id).value="";
});
}

/* RENDER */
function render(){

let html="";
let sum=0;

cart.forEach((i,index)=>{
sum+=i.total;

html+=`
<tr>
<td>${i.name}</td>
<td>${i.p}</td>
<td>${i.total.toFixed(2)}</td>
<td><button onclick="del(${index})" style="background:red">❌</button></td>
</tr>`;
});

document.getElementById("list").innerHTML=html;
document.getElementById("totalBox").innerText="Total: "+sum.toFixed(2);
}

/* DELETE */
function del(i){
cart.splice(i,1);
render();
}

/* CLEAR */
function clearCart(){
cart=[];
render();
}

/* CONFIRM */
function confirmOrder(){

if(cart.length===0){
alert("No items");
return;
}

let total=cart.reduce((a,b)=>a+b.total,0);

monthly.push({
total,
date:new Date().toLocaleString()
});

localStorage.setItem("monthly",JSON.stringify(monthly));

cart=[];
render();

alert("Saved");
}
let deletedRecord = null;
let deletedIndex = null;

/* MONTHLY */
function loadMonthly(){

let data = JSON.parse(localStorage.getItem("monthly")) || [];

let html="";
let sum=0;

data.forEach((m,index)=>{

sum += m.total;

html += `
<div style="
padding:10px;
border:1px solid #ccc;
margin:8px 0;
border-radius:8px;
background:#fff">

📅 ${m.date}<br>
💰 <b>${m.total.toFixed(2)}</b>

<button 
onclick="deleteMonthly(${index})"
style="
margin-top:8px;
background:red;
color:#fff;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer">
Delete
</button>

</div>`;
});

html += `
<hr>
<h3>Total: ${sum.toFixed(2)}</h3>

<button 
onclick="undoDelete()"
style="
background:orange;
color:#fff;
border:none;
padding:10px;
border-radius:5px;
width:100%;
margin-top:10px">
Undo Delete
</button>
`;

document.getElementById("records").innerHTML = html;
}

/* DELETE MONTHLY */
function deleteMonthly(index){

let data = JSON.parse(localStorage.getItem("monthly")) || [];

deletedRecord = data[index];
deletedIndex = index;

data.splice(index,1);

localStorage.setItem("monthly", JSON.stringify(data));

loadMonthly();
}

/* UNDO DELETE */
function undoDelete(){

if(deletedRecord == null){
alert("Nothing to undo");
return;
}

let data = JSON.parse(localStorage.getItem("monthly")) || [];

data.splice(deletedIndex,0,deletedRecord);

localStorage.setItem("monthly", JSON.stringify(data));

deletedRecord = null;
deletedIndex = null;

loadMonthly();

alert("Restored");
}
/* MONTHLY */
function loadMonthly(){

let data = JSON.parse(localStorage.getItem("monthly")) || [];

let html="";
let sum=0;

data.forEach(m=>{
sum+=m.total;

html+=`
<div style="padding:10px;border:1px solid #ccc;margin:5px">
${m.date}<br>${m.total.toFixed(2)}
</div>`;
});

document.getElementById("records").innerHTML =
html + "<hr>Total: "+sum.toFixed(2);
}

/* PDF */
function downloadPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let customer =
document.getElementById("customer").value || "Walk-in Customer";

let discount =
Number(document.getElementById("discount").value) || 0;

let sum = 0;

/* HEADER */
doc.setFillColor(20,20,20);
doc.rect(0,0,210,32,"F");

doc.setTextColor(255,255,255);
doc.setFontSize(22);
doc.text("TABUK MARBLE",105,15,{align:"center"});

doc.setFontSize(11);
doc.text("Premium Marble Invoice",105,24,{align:"center"});

/* RESET COLOR */
doc.setTextColor(0,0,0);

/* CUSTOMER INFO */
doc.setFontSize(11);

doc.text("Customer: " + customer,10,45);

doc.text(
"Date: " + new Date().toLocaleString(),
140,
45
);

/* TABLE HEADER */
doc.setFillColor(40,40,40);
doc.rect(10,55,190,10,"F");

doc.setTextColor(255,255,255);

doc.text("Item",15,62);
doc.text("Qty",90,62);
doc.text("Total",160,62);

doc.setTextColor(0,0,0);

let y = 75;

/* ITEMS */
cart.forEach((i,index)=>{

sum += i.total;

/* ROW BG */
if(index % 2 == 0){
doc.setFillColor(245,245,245);
doc.rect(10,y-5,190,8,"F");
}

doc.text(i.name,15,y);
doc.text(String(i.p),90,y);
doc.text(i.total.toFixed(2),160,y);

y += 10;

/* PAGE BREAK */
if(y > 270){
doc.addPage();
y = 20;
}
});

/* TOTALS */
let discAmount = (sum * discount)/100;
let finalTotal = sum - discAmount;

y += 10;

doc.setFontSize(12);

doc.text("Subtotal:",130,y);
doc.text(sum.toFixed(2),170,y);

y += 8;

doc.text("Discount:",130,y);
doc.text(discount + "%",170,y);

y += 12;

/* FINAL TOTAL BOX */
doc.setFillColor(0,120,0);
doc.rect(120,y-6,80,12,"F");

doc.setTextColor(255,255,255);

doc.setFontSize(14);
doc.text(
"TOTAL: " + finalTotal.toFixed(2),
160,
y+2,
{align:"center"}
);

/* RESET */
doc.setTextColor(0,0,0);

/* FOOTER */
y += 28;

doc.setFontSize(10);

doc.text(
"Thank you for choosing TABUK MARBLE",
10,
y
);

/* SIGNATURE */
y += 20;

doc.line(135,y,195,y);

doc.text(
"Authorized Signature",
145,
y+6
);

/* PAID STAMP */
doc.setDrawColor(0,150,0);
doc.setTextColor(0,150,0);

doc.setFontSize(22);

doc.text(
"PAID",
150,
120,
{angle:25}
);

/* SAVE */
doc.save("TABUK_MARBLE_INVOICE.pdf");
}
</script>

</body>
</html>
