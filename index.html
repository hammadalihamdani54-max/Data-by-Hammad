<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabuk Marble POS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; padding:10px; }
.container { background:white; padding:10px; border-radius:10px; }
input, select { width:100%; padding:8px; margin:5px 0; }
button { padding:10px; width:100%; margin-top:5px; }
table { width:100%; margin-top:10px; border-collapse: collapse; }
th, td { border:1px solid #ccc; padding:5px; text-align:center; }
</style>
</head>

<body>

<h2 style="text-align:center;">TABUK MARBLE</h2>

<div class="container">

<input id="name" placeholder="Item Name">
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<input id="pieces" type="number" placeholder="Pieces">
<input id="price" type="number" placeholder="Price">

<input id="customer" placeholder="Customer Name">
<input id="discount" type="number" placeholder="Discount %">

<select id="currency">
<option value="SAR">SAR</option>
<option value="PKR">PKR</option>
<option value="USD">USD</option>
</select>

<button onclick="addItem()">Add Item</button>
<button onclick="downloadPDF()">Download PDF</button>

<table>
<tr>
<th>Name</th><th>L</th><th>W</th><th>Pcs</th><th>m²</th><th>Price</th><th>Total</th><th>Action</th>
</tr>
<tbody id="list"></tbody>
</table>

<h3 id="grandTotal">Total: 0</h3>

</div>

<script>
let items = [];

// ADD ITEM
function addItem(){
let name = document.getElementById("name").value.trim();
let l = Number(document.getElementById("length").value);
let w = Number(document.getElementById("width").value);
let p = Number(document.getElementById("pieces").value);
let price = Number(document.getElementById("price").value);
let currency = document.getElementById("currency").value;

if(!name || !l || !w || !p || !price){
alert("Fill all fields");
return;
}

let sqm = l*w*p;
let total = sqm*price;

items.push({name,l,w,p,price,sqm,total,currency});
render();
}

// DELETE
function deleteItem(index){
items.splice(index,1);
render();
}

// RENDER
function render(){
let html="";
let sum=0;

items.forEach((i,index)=>{
sum+=i.total;

html+=`
<tr>
<td>${i.name}</td>
<td>${i.l}</td>
<td>${i.w}</td>
<td>${i.p}</td>
<td>${i.sqm.toFixed(2)}</td>
<td>${i.price} ${i.currency}</td>
<td>${i.total.toFixed(2)}</td>
<td><button onclick="deleteItem(${index})">❌</button></td>
</tr>`;
});

document.getElementById("list").innerHTML=html;
document.getElementById("grandTotal").innerText="Total: "+sum.toFixed(2);
}

// PDF
function downloadPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let sum=0;

doc.text("TABUK MARBLE INVOICE", 10, 10);

let y=20;

items.forEach(i=>{
sum+=i.total;

doc.text(
`${i.name} | ${i.l}x${i.w} | ${i.total.toFixed(2)} ${i.currency}`,
10,y
);

y+=8;
});

doc.text("Total: "+sum.toFixed(2),10,y+10);

doc.save("invoice.pdf");
}
</script>

</body>
</html>
