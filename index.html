5To<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<meta charset="UTF-8">
<title>Data by Hammad</title>
<style>
body { font-family: Arial; background:#f4f4f4; margin:0; padding:10px; }
h2 { text-align:center; }
.container { background:white; padding:10px; border-radius:10px; }
input { width:100%; padding:8px; margin:5px 0; }
button { padding:10px; width:100%; margin-top:5px; background:green; color:white; border:none; }
table { width:100%; margin-top:10px; border-collapse: collapse; }
th, td { border:1px solid #ccc; padding:5px; text-align:center; }
.total { font-size:18px; font-weight:bold; text-align:right; margin-top:10px; }
</style>
</head>
<body>

<h2>Data by Hammad</h2>

<div class="container">

<input id="name" placeholder="Item Name">
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<input id="pieces" type="number" placeholder="Pieces">
<input id="price" type="number" placeholder="Price per unit">
 
<input id="discount" type="number" placeholder="Discount (%)">
 <input id="customer" placeholder="Customer Name">



<button onclick="clearAll()" style="background:red;">Clear All Items</button> 
<select id="currency">
  <option value="SAR">🇸🇦 SAR</option>
  <option value="PKR">🇵🇰 PKR</option>
  <option value="USD">🇺🇸 USD</option>
  <option value="AED">🇦🇪 AED</option>
</select>
<button onclick="addItem()">Add Item</button>
<button onclick="downloadPDF()" style="background:blue;">📄 Download PDF</button>
<table>
<tr>
<th>Name</th>
<th>L</th>
<th>W</th>
<th>Pcs</th>
<th>m²</th>
<th>Price</th>
<th>Total</th>
<th>Action</th>
</tr>
<tbody id="list"></tbody>
</table>

<div class="total" id="grandTotal">Total: 0</div>

</div>

<script>
let items = [];
function downloadPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF(); // ✅ SAB SE PEHLE

let sum = 0;
let discount = Number(document.getElementById("discount").value) || 0;
let customer = document.getElementById("customer").value || "Walk-in Customer";
let invoiceNo = localStorage.getItem("invNo") || 1;

// ===== 🟢 PREMIUM LOGO =====
doc.setFontSize(22);
doc.setTextColor(40, 40, 40);
doc.setFont(undefined, "bold");

doc.text("TABUK MARBLE", 105, 15, { align: "center" });

doc.setDrawColor(150);
doc.line(60, 18, 150, 18);

doc.setFontSize(10);
doc.setTextColor(120,120,120);
doc.setFont(undefined, "normal");

doc.text("Premium Marble & Stone Supplier", 105, 24, { align: "center" });

doc.setTextColor(0,0,0);

// ===== HEADER =====
doc.setFontSize(11);
doc.text("Invoice #" + invoiceNo, 14, 35);

let date = new Date();
doc.text("Date: " + date.toLocaleString(), 140, 35);

doc.text("Customer: " + customer, 14, 42);

doc.line(14, 45, 195, 45);

// ===== TABLE =====
let y = 55;

doc.setFont(undefined, "bold");
doc.text("Item", 14, y);
doc.text("L", 55, y);
doc.text("W", 70, y);
doc.text("Pcs", 85, y);
doc.text("m²", 105, y);
doc.text("Price", 130, y);
doc.text("Total", 165, y);

doc.line(14, y+2, 195, y+2);

y += 10;
doc.setFont(undefined, "normal");

// items
items.forEach(i=>{
sum += i.total;

doc.text(i.name, 14, y);
doc.text(String(i.l), 55, y);
doc.text(String(i.w), 70, y);
doc.text(String(i.p), 85, y);
doc.text(i.sqm.toFixed(2), 105, y);
doc.text(i.price.toFixed(2) + " " + (i.currency || ""), 130, y);
doc.text((i.total || 0).toFixed(2), 165, y);

y += 8;

if(y > 260){
doc.addPage();
y = 20;
}
});

// ===== TOTAL =====
let discAmount = (sum * discount) / 100;
let finalTotal = sum - discAmount;

y += 10;

doc.setFont(undefined, "bold");
doc.text("Subtotal: " + sum.toFixed(2), 140, y);

y += 7;
doc.text("Discount: " + discount + "% (-" + discAmount.toFixed(2) + ")", 140, y);

y += 7;

// total box
doc.rect(130, y+2, 60, 12);
doc.text("TOTAL: " + finalTotal.toFixed(2), 132, y+10);

// ===== FOOTER + SIGNATURE =====
y += 25;

doc.line(14, y, 195, y);

y += 10;

// center text
let pageWidth = doc.internal.pageSize.getWidth();

doc.setFontSize(11);
doc.text("Thank you for shopping with us!", pageWidth/2, y, {align:"center"});

y += 15;

// signatures
doc.setFontSize(10);

doc.line(20, y, 80, y);
doc.text("Customer Signature", 20, y+5);

doc.line(120, y, 180, y);
doc.text("Authorized Signature", 120, y+5);

// save
doc.save("invoice_" + invoiceNo + ".pdf");

// increment
localStorage.setItem("invNo", Number(invoiceNo) + 1);
}

// discount
let discAmount = (sum * discount) / 100;
let finalTotal = sum - discAmount;

y += 10;

doc.setFont(undefined, "bold");
doc.text("Subtotal: " + sum.toFixed(2), 140, y);

y += 7;
doc.text("Discount: " + discount + "% (-" + discAmount.toFixed(2) + ")", 140, y);

y += 7;

// total box
doc.rect(130, y+2, 60, 12);
doc.text("TOTAL: " + finalTotal.toFixed(2), 132, y+10);

// footer
doc.setFontSize(10);
doc.text("Thank you for shopping with us!", 14, y+25);
// save invoice
doc.save("invoice_" + invoiceNo + ".pdf");

// increment invoice number
localStorage.setItem("invNo", Number(invoiceNo) + 1);
}
// Load data on start
window.onload = function(){
    let saved = localStorage.getItem("items");
    if(saved){
        items = JSON.parse(saved);
        render();
    }
}
function deleteItem(index){
items.splice(index, 1);
localStorage.setItem("items", JSON.stringify(items));
render();
}
function addItem(){

let name = document.getElementById("name").value.trim();
let l = Number(document.getElementById("length").value);
let w = Number(document.getElementById("width").value);
let p = Number(document.getElementById("pieces").value);
let price = Number(document.getElementById("price").value);
let currency = document.getElementById("currency").value;

if(name === "" || isNaN(l) || isNaN(w) || isNaN(p) || isNaN(price)){
alert("Fill all fields properly");
return;
}

let sqm = l * w * p;
let total = sqm * price;

items.push({name, l, w, p, price, sqm, total, currency});

localStorage.setItem("items", JSON.stringify(items));

render();

// clear inputs
document.getElementById("name").value = "";
document.getElementById("length").value = "";
document.getElementById("width").value = "";
document.getElementById("pieces").value = "";
document.getElementById("price").value = "";

}
function render(){
let table = document.getElementById("list");
table.innerHTML = "";

let sum = 0;

items.forEach((i,index)=>{
sum += i.total;

table.innerHTML += `
<tr>
<td>${i.name}</td>
<td>${i.l}</td>
<td>${i.w}</td>
<td>${i.p}</td>
<td>${i.sqm.toFixed(2)} m²</td>
<td>${i.price.toFixed(2)} ${i.currency}</td>
<td>${i.total.toFixed(2)} ${i.currency}</td>
<td><button onclick="deleteItem(${index})" style="background:red;">❌</button></td>
</tr>`;
});

document.getElementById("grandTotal").innerText =
"Total: " + sum.toFixed(2);
}
// Optional: Clear all data
function clearAll(){
items = [];
localStorage.removeItem("items");
render();
}
</script>

</body>
</html>
