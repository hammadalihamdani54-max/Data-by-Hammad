<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Riyadh Stone Front Elevation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 20px;
  }
  .container {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    max-width: 1100px;
    width: 100%;
  }
  h2 {
    text-align: center;
    color: #333;
    margin-bottom: 15px;
    font-size: 20px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 15px;
    font-size: 13px;
    color: #555;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend .box {
    width: 18px;
    height: 18px;
    border: 1px solid #999;
    border-radius: 3px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    background: #d9d9d9;
  }
  .download-btn {
    display: block;
    margin: 15px auto 0;
    padding: 10px 30px;
    background: #2c3e50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
  }
  .download-btn:hover { background: #1a252f; }
</style>
</head>
<body>
<div class="container">
  <h2>🏛️ Riyadh Stone — Front Elevation Design</h2>
  <div class="legend">
    <span><div class="box" style="background:#e8e4d8;"></div> ابيض مجلي (پالش)</span>
    <span><div class="box" style="background:#d4cfc0;"></div> ابيض مصنفر (ریتلا)</span>
    <span><div class="box" style="background:#b8a88a;"></div> مبروم بارڈر 3cm</span>
    <span><div class="box" style="background:#4a4a4a;"></div> جرانیت نجرانی</span>
    <span><div class="box" style="background:#1a1a1a;"></div> کھڑکی/دروازہ</span>
  </div>

  <svg id="elevation" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- مجلی پیٹرن (پالش سفید پتھر) -->
      <pattern id="majli" width="80" height="40" patternUnits="userSpaceOnUse">
        <rect width="80" height="40" fill="#e8e4d8"/>
        <rect x="0" y="0" width="80" height="40" fill="none" stroke="#c9c3b2" stroke-width="1.5"/>
        <rect x="2" y="2" width="76" height="36" fill="none" stroke="#f5f2ea" stroke-width="0.8"/>
      </pattern>

      <!-- مصنفر پیٹرن (ریتلا سفید پتھر) -->
      <pattern id="musanfar" width="40" height="20" patternUnits="userSpaceOnUse">
        <rect width="40" height="20" fill="#d4cfc0"/>
        <rect x="0" y="0" width="40" height="20" fill="none" stroke="#b5ae9c" stroke-width="1"/>
        <circle cx="10" cy="10" r="0.8" fill="#c0b9a6"/>
        <circle cx="28" cy="6" r="0.7" fill="#c0b9a6"/>
        <circle cx="22" cy="15" r="0.6" fill="#c0b9a6"/>
        <circle cx="35" cy="12" r="0.7" fill="#c0b9a6"/>
      </pattern>

      <!-- مبروم پیٹرن (گول کنارہ بارڈر) -->
      <pattern id="mabroom" width="30" height="15" patternUnits="userSpaceOnUse">
        <rect width="30" height="15" fill="#b8a88a"/>
        <rect x="0" y="0" width="30" height="15" fill="none" stroke="#9c8d70" stroke-width="1.2"/>
        <line x1="0" y1="7.5" x2="30" y2="7.5" stroke="#c9bca3" stroke-width="0.6"/>
      </pattern>

      <!-- جرانیت نجرانی پیٹرن 30x60 -->
      <pattern id="granite" width="60" height="30" patternUnits="userSpaceOnUse">
        <rect width="60" height="30" fill="#4a4a4a"/>
        <circle cx="10" cy="8" r="1" fill="#6b6b6b"/>
        <circle cx="30" cy="15" r="1.2" fill="#5c5c5c"/>
        <circle cx="50" cy="22" r="0.9" fill="#707070"/>
        <circle cx="20" cy="25" r="1" fill="#555"/>
        <circle cx="45" cy="5" r="0.8" fill="#666"/>
        <rect x="0" y="0" width="60" height="30" fill="none" stroke="#333" stroke-width="1"/>
      </pattern>

      <!-- شیڈو -->
      <filter id="shadow">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
      </filter>
    </defs>

    <!-- پس منظر: آسمان -->
    <rect width="1000" height="750" fill="#cfe3f0"/>
    <ellipse cx="200" cy="80" rx="80" ry="25" fill="#fff" opacity="0.6"/>
    <ellipse cx="750" cy="60" rx="100" ry="20" fill="#fff" opacity="0.5"/>

    <!-- پڑوسی عمارت (دائیں) -->
    <rect x="880" y="180" width="120" height="420" fill="#e8dcc8" stroke="#c9bca0" stroke-width="2"/>
    <rect x="900" y="220" width="35" height="45" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="955" y="220" width="35" height="45" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="900" y="290" width="35" height="45" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="955" y="290" width="35" height="45" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="895" y="200" width="90" height="20" fill="#d4c9b0" stroke="#b8a88a" stroke-width="1"/>

    <!-- پڑوسی عمارت (بائیں) -->
    <rect x="0" y="300" width="60" height="300" fill="#ddd4c0" stroke="#b8a88a" stroke-width="2"/>
    <rect x="15" y="340" width="30" height="40" fill="#555" stroke="#333" stroke-width="1.5"/>

    <!-- ===== مین بلڈنگ ===== -->
    <g filter="url(#shadow)">
      <!-- عمارت کا مرکزی ڈھانچہ -->
      <rect x="70" y="80" width="810" height="420" fill="url(#majli)" stroke="#a89c82" stroke-width="3"/>

      <!-- نچلا حصہ (چھجے کے نیچے والی دیوار) -->
      <rect x="70" y="440" width="810" height="180" fill="url(#majli)" stroke="#a89c82" stroke-width="3"/>
    </g>

    <!-- ===== نچلے حصے میں محرابیں (Arches) ===== -->
    <g opacity="0.9">
      <!-- بائیں محراب -->
      <path d="M 130 620 L 130 520 Q 130 470 200 470 Q 270 470 270 520 L 270 620 Z" fill="url(#musanfar)" stroke="#a89c82" stroke-width="2"/>
      <!-- درمیانی بائیں محراب -->
      <path d="M 320 620 L 320 520 Q 320 470 390 470 Q 460 470 460 520 L 460 620 Z" fill="url(#musanfar)" stroke="#a89c82" stroke-width="2"/>
      <!-- درمیانی دائیں محراب -->
      <path d="M 590 620 L 590 520 Q 590 470 660 470 Q 730 470 730 520 L 730 620 Z" fill="url(#musanfar)" stroke="#a89c82" stroke-width="2"/>
      <!-- دائیں محراب -->
      <path d="M 780 620 L 780 520 Q 780 470 850 470 Q 920 470 920 520 L 920 620 Z" fill="url(#musanfar)" stroke="#a89c82" stroke-width="2"/>
    </g>

    <!-- ===== کھڑکیاں (اوپر والی منزل) ===== -->
    <!-- کھڑکی 1 (بائیں) - محرابی -->
    <path d="M 150 180 L 150 260 Q 150 290 190 290 L 210 290 Q 250 290 250 260 L 250 180 Z" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="8"/>
    <!-- کھڑکی 2 -->
    <path d="M 350 180 L 350 260 Q 350 290 390 290 L 410 290 Q 450 290 450 260 L 450 180 Z" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="8"/>
    <!-- کھڑکی 3 (مربع) -->
    <rect x="480" y="200" width="60" height="60" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="8"/>
    <!-- کھڑکی 4 (بڑی محرابی - ٹوٹی ہوئی) -->
    <path d="M 580 180 L 580 290 Q 580 320 620 320 L 680 320 Q 720 320 720 290 L 720 180 Z" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="8"/>
    <!-- کھڑکی 5 (دائیں) - محرابی -->
    <path d="M 780 180 L 780 260 Q 780 290 820 290 L 840 290 Q 880 290 880 260 L 880 180 Z" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="8"/>

    <!-- ===== دروازہ (وسط میں) ===== -->
    <rect x="460" y="480" width="90" height="140" fill="#1a1a1a" stroke="url(#mabroom)" stroke-width="10"/>

    <!-- ===== بارڈر فریم (مبروم) — عمارت کے کناروں پر ===== -->
    <!-- ٹاپ بارڈر -->
    <rect x="70" y="80" width="810" height="12" fill="url(#mabroom)" stroke="#9c8d70" stroke-width="1"/>
    <!-- بائیں بارڈر -->
    <rect x="70" y="80" width="12" height="540" fill="url(#mabroom)" stroke="#9c8d70" stroke-width="1"/>
    <!-- دائیں بارڈر -->
    <rect x="868" y="80" width="12" height="540" fill="url(#mabroom)" stroke="#9c8d70" stroke-width="1"/>
    <!-- نیچے بارڈر -->
    <rect x="70" y="608" width="810" height="12" fill="url(#mabroom)" stroke="#9c8d70" stroke-width="1"/>

    <!-- ===== باونڈری وال (Boundary Wall) ===== -->
    <g filter="url(#shadow)">
      <!-- باونڈری دیوار -->
      <rect x="70" y="620" width="810" height="100" fill="url(#majli)" stroke="#a89c82" stroke-width="3"/>

      <!-- باونڈری کا دروازہ -->
      <rect x="440" y="630" width="120" height="90" fill="url(#musanfar)" stroke="url(#mabroom)" stroke-width="6"/>

      <!-- باونڈری ٹاپ بارڈر -->
      <rect x="70" y="620" width="810" height="10" fill="url(#mabroom)" stroke="#9c8d70" stroke-width="1"/>
    </g>

    <!-- ===== جرانیت نجرانی بنیاد (30×60) ===== -->
    <rect x="60" y="720" width="830" height="30" fill="url(#granite)" stroke="#2a2a2a" stroke-width="2"/>
    <!-- گرینائٹ کے جوڑ -->
    <g stroke="#2a2a2a" stroke-width="1.5">
      <line x1="120" y1="720" x2="120" y2="750"/>
      <line x1="180" y1="720" x2="180" y2="750"/>
      <line x1="240" y1="720" x2="240" y2="750"/>
      <line x1="300" y1="720" x2="300" y2="750"/>
      <line x1="360" y1="720" x2="360" y2="750"/>
      <line x1="420" y1="720" x2="420" y2="750"/>
      <line x1="480" y1="720" x2="480" y2="750"/>
      <line x1="540" y1="720" x2="540" y2="750"/>
      <line x1="600" y1="720" x2="600" y2="750"/>
      <line x1="660" y1="720" x2="660" y2="750"/>
      <line x1="720" y1="720" x2="720" y2="750"/>
      <line x1="780" y1="720" x2="780" y2="750"/>
      <line x1="840" y1="720" x2="840" y2="750"/>
    </g>

    <!-- ===== سڑک ===== -->
    <rect x="0" y="750" width="1000" height="0" fill="#555"/>

    <!-- ===== لیبل (Labels) ===== -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">
      <text x="500" y="55" font-size="16" font-weight="bold" fill="#2c3e50">FRONT ELEVATION — RIYADH STONE</text>
    </g>
  </svg>

  <button class="download-btn" onclick="downloadPNG()">⬇️ تصویر ڈاؤن لوڈ کریں (PNG)</button>
</div>

<script>
function downloadPNG() {
  const svg = document.getElementById('elevation');
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svg);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);

  img.onload = function() {
    canvas.width = 2000;
    canvas.height = 1500;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const pngUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl;
    a.download = 'riyadh-stone-elevation.png';
    a.click();
  };
  img.src = url;
}
</script>
</body>
</html>
