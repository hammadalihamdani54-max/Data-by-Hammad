<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data By Hammad - ERP</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f5;padding:10px}
.box{background:#fff;padding:15px;border-radius:10px}

input,select{
width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:5px
}

button{
width:100%;padding:10px;margin-top:5px;border:none;border-radius:5px;color:#fff;font-weight:bold
}

.green{background:green}
.blue{background:#007bff}
.red{background:red}

table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#222;color:#fff}
</style>
</head>

<body>

<div class="box">

<h2 style="text-align:center">DATA BY HAMMAD</h2>

<!-- INPUTS -->
<input id="item" placeholder="Item Name">
<input id="cost" type="number" placeholder="Cost Price">
<input id="sell" type="number" placeholder="Selling Price">
<input id="qty" type="number" placeholder="Quantity">

<input id="customer" placeholder="Customer Name">
<input id="discount" type="number" placeholder="Discount %">

<select id="status">
<option value="PAID">PAID</option>
<option value="NOT PAID">NOT PAID</option>
</select>

<button class="green" onclick="addItem()">➕ Add Item</button>
<button class="blue" onclick="downloadPDF()">📄 PDF</button>
<button class="red" onclick="clearAll()">🗑 Clear</button>

<table>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Sell</th>
<th>Total</th>
<th>Action</th>
</tr>
<tbody id="list"></tbody>
</table>

<h3 id="summary">Total: 0 | Profit: 0</h3>

</div>

<script>

let cart=[];

/* ================= ADD ITEM FIXED ================= */
function addItem(){

let n=document.getElementById("item").value.trim();
let c=Number(document.getElementById("cost").value);
let s=Number(document.getElementById("sell").value);
let q=Number(document.getElementById("qty").value);

/* STRICT VALIDATION FIX */
if(!n || !c || !s || !q){
alert("Fill all fields properly");
return;
}

cart.push({
n,c,s,q,
profit:(s-c)*q
});

/* clear inputs */
item.value="";
cost.value="";
sell.value="";
qty.value="";

render();
}

/* ================= RENDER ================= */
function render(){

let html="";
let total=0;
let profit=0;

cart.forEach((i,index)=>{
let t=i.s*i.q;
total+=t;
profit+=i.profit;

html+=`
<tr>
<td>${i.n}</td>
<td>${i.q}</td>
<td>${i.s}</td>
<td>${t.toFixed(2)}</td>
<td><button onclick="del(${index})" style="background:red">❌</button></td>
</tr>`;
});

list.innerHTML=html;
summary.innerText="Total: "+total.toFixed(2)+" | Profit: "+profit.toFixed(2);
}

/* ================= DELETE ================= */
function del(i){
cart.splice(i,1);
render();
}

/* ================= CLEAR ================= */
function clearAll(){
cart=[];
render();
}

/* ================= FIXED PDF ================= */
function downloadPDF(){

const {jsPDF}=window.jspdf;
let doc=new jsPDF();

let y=20;
let total=0;

let customer=document.getElementById("customer").value || "Walk-in Customer";
let status=document.getElementById("status").value;
let discount=Number(document.getElementById("discount").value)||0;

/* HEADER */
doc.setFontSize(18);
doc.text("DATA BY HAMMAD",105,10,{align:"center"});

doc.setFontSize(11);
doc.text("Customer: "+customer,10,25);
doc.text("Status: "+status,150,25);

let date=new Date();
doc.text("Date: "+date.toLocaleString(),10,32);

doc.line(10,35,200,35);

y=45;

/* TABLE HEADER */
doc.text("Item",10,y);
doc.text("Qty",70,y);
doc.text("Sell",110,y);
doc.text("Total",150,y);

y+=10;

/* ITEMS */
cart.forEach(i=>{
let t=i.s*i.q;
total+=t;

doc.text(i.n,10,y);
doc.text(String(i.q),70,y);
doc.text(String(i.s),110,y);
doc.text(t.toFixed(2),150,y);

y+=8;
if(y>270){doc.addPage();y=20;}
});

/* DISCOUNT */
let disc=(total*discount)/100;
let final=total-disc;

y+=10;
doc.text("Subtotal: "+total.toFixed(2),10,y);
y+=7;
doc.text("Discount: "+discount+"%",10,y);
y+=7;

doc.setFontSize(14);
doc.text("TOTAL: "+final.toFixed(2),10,y+10);

/* STATUS STAMP */
doc.setFontSize(16);
doc.text(status,150,y+10);

doc.save("invoice.pdf");
}

</script>

</body>
</html>
