<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data by Hammad</title>
<style>
body { font-family: Arial; background:#f4f4f4; margin:0; padding:10px; }
h2 { text-align:center; }
.container { background:white; padding:10px; border-radius:10px; }
input { width:100%; padding:8px; margin:5px 0; }
button { padding:10px; width:100%; margin-top:5px; background:green; color:white; border:none; }
table { width:100%; margin-top:10px; border-collapse: collapse; }
th, td { border:1px solid #ccc; padding:5px; text-align:center; }
.total { font-size:18px; font-weight:bold; text-align:right; margin-top:10px; }
</style>
</head>
<body>

<h2>Data by Hammad</h2>

<div class="container">

<input id="name" placeholder="Item Name">
<input id="length" type="number" placeholder="Length">
<input id="width" type="number" placeholder="Width">
<input id="pieces" type="number" placeholder="Pieces">
<input id="price" type="number" placeholder="Price per unit">
<select id="currency">
  <option value="SAR">🇸🇦 SAR</option>
  <option value="PKR">🇵🇰 PKR</option>
  <option value="USD">🇺🇸 USD</option>
  <option value="AED">🇦🇪 AED</option>
</select>
<button onclick="addItem()">Add Item</button>

<table>
<tr>
<th>Name</th>
<th>L</th>
<th>W</th>
<th>Pcs</th>
<th>m²</th>
<th>Price</th>
<th>Total</th>
</tr>
<tbody id="list"></tbody>
</table>

<div class="total" id="grandTotal">Total: 0</div>

</div>

<script>
let items = [];

// Load data on start
window.onload = function(){
    let saved = localStorage.getItem("items");
    if(saved){
        items = JSON.parse(saved);
        render();
    }
}

function addItem(){
let name = document.getElementById("name").value;
let l = parseFloat(document.getElementById("length").value);
let w = parseFloat(document.getElementById("width").value);
let p = parseFloat(document.getElementById("pieces").value);
let price = parseFloat(document.getElementById("price").value);
function saveData(){
localStorage.setItem("items", JSON.stringify(items));
                       }
if(!name || !l || !w || !p || !price){
alert("Please fill all fields");
return;
}

let sqm = l * w * p;
let total = sqm * price;

items.push({name,l,w,p,sqm,total});

saveData();
render();
}
function render(){
let table = document.getElementById("list");
table.innerHTML = "";
let sum = 0;
let currency = document.getElementById("currency").value;
items.forEach(i=>{
sum += i.total;

// safe square meter (agar missing ho to 0)
let sqm = i.sqm ? i.sqm : (i.l * i.w * i.p);

table.innerHTML += `
<tr>
<td>${i.name}</td>
<td>${i.l}</td>
<td>${i.w}</td>
<td>${i.p}</td>
<td>${sqm.toFixed(2)}</td>
<td>${i.total.toFixed(2)}</td>
</tr>`;
});

document.getElementById("grandTotal").innerText =
"Total: " + sum.toFixed(2);
}

// Optional: Clear all data
function clearAll(){
    items = [];
    saveData();
    render();
}
</script>

</body>
</html>
